<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Luiz Cordeiro · theRoom</title>
<meta name="ext-resource-dependency" content="audio/rain.mp3" data-resource-id="rainMp3" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root { --ink: #060A07; --soil: #0E1610; --moss: #1B2A1F; --phosphor: #3BE77B; --phosphor-dim: #1F8A4A; --phosphor-bloom: #C8FFD6; --paper: #B9C9BC; --ex-w: 760px; --ex-h: 460px; --ex-fade: 250ms; --ex-slide: 12px; --ex-dim: 0.55; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  /* #root is the frame: fixed UI hangs off it and the container queries below measure it. ?vp=390x844 shrinks it to a phone-sized preview. */
  #root { position: fixed; inset: 0; container-type: size; }
  #root.vp { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); outline: 1px solid var(--moss); overflow: hidden; }
  #boot { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 14px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--phosphor-dim); white-space: nowrap; }
  #boot i { display: inline-block; width: 7px; height: 12px; margin-left: 4px; vertical-align: -1px; background: var(--phosphor); animation: boot-blink 1s steps(1) infinite; }
  @keyframes boot-blink { 50% { opacity: 0; } }
  #room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #fade { position: fixed; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
  .hud { position: fixed; right: 16px; font: 12px/1.5 "IBM Plex Mono", ui-monospace, monospace; color: var(--phosphor); background: var(--soil); border: 1px solid var(--moss); padding: 8px 10px; white-space: pre; pointer-events: none; margin: 0; }
  #fps { top: calc(var(--top-h, 52px) + 16px); }
  #hud { top: calc(var(--top-h, 52px) + 56px); }
  #hud .dim { color: var(--phosphor-dim); }
  /* accent picker: a row of small LED push-buttons. Each shows its own colour (--led); the active one lights up and glows. */
  #accent { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 6px; margin: 0; padding: 6px; list-style: none; background: var(--ink); border: 1px solid var(--moss); }
  #accent button { appearance: none; width: 22px; height: 22px; padding: 0; cursor: pointer; border-radius: 0; background: var(--ink); border: 1px solid var(--moss); display: grid; place-items: center; }
  #accent button::before { content: ""; width: 8px; height: 8px; background: color-mix(in srgb, var(--led) 40%, var(--ink)); transition: background 120ms linear, box-shadow 120ms linear; }
  #accent button:hover { border-color: var(--led); }
  #accent button:hover::before { background: color-mix(in srgb, var(--led) 75%, var(--ink)); }
  #accent button[aria-pressed="true"] { border-color: var(--led); }
  #accent button[aria-pressed="true"]::before { background: var(--led); box-shadow: 0 0 6px 1px var(--led), 0 0 14px 2px color-mix(in srgb, var(--led) 45%, transparent); }
  #accent button:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
  #root[data-touch] #accent button { width: 32px; height: 32px; }
  #chip { position: fixed; left: 0; top: 0; font: 15px/1 Silkscreen, VT323, ui-monospace, monospace; text-transform: uppercase; letter-spacing: 0.04em; color: var(--phosphor-bloom); text-shadow: 0 0 8px var(--phosphor-bloom); background: var(--soil); border: 1px solid var(--phosphor); padding: 9px 12px 8px; pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity 150ms linear; will-change: transform; }
  #chip.on { opacity: 1; }
  #chip .more { color: var(--phosphor); text-shadow: none; opacity: 0.7; }
  @media (prefers-reduced-motion: reduce) { #chip { transition: none; } }
  #room.hot { cursor: pointer; }
  #room.drag { cursor: grabbing; }
  #room.pan { cursor: move; }
  #room.shell { cursor: text; }
  #shell-in { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
  /* explorer window: flat soil sheet, 1px moss border, no radius, no shadow */
  #dim { position: fixed; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; transition: opacity var(--ex-fade) linear; z-index: 5; }
  #dim.on { opacity: var(--ex-dim); pointer-events: auto; }
  #explorer { position: fixed; left: 50%; top: 50%; width: min(var(--ex-w), 92vw); height: min(var(--ex-h), calc(100vh - 140px)); transform: translate(-50%, calc(-50% + var(--ex-slide))); background: var(--soil); border: 1px solid var(--moss); color: var(--phosphor); display: grid; grid-template-rows: 40px minmax(0, 1fr) 28px; opacity: 0; pointer-events: none; transition: opacity var(--ex-fade) linear, transform var(--ex-fade) cubic-bezier(.25, 1, .5, 1); font: 13px/1.6 "IBM Plex Mono", ui-monospace, monospace; z-index: 6; }
  #explorer.on { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  #explorer .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--moss); }
  #explorer .path { font: 24px/1 VT323, ui-monospace, monospace; color: var(--phosphor); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #explorer .path b { color: var(--phosphor-dim); font-weight: 400; }
  #explorer .close { appearance: none; background: none; border: 0; padding: 8px; font: 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--phosphor-dim); cursor: pointer; white-space: nowrap; }
  #explorer .close:hover { color: var(--phosphor); }
  #explorer .body { display: grid; grid-template-columns: 400px minmax(0, 1fr); min-height: 0; }
  #explorer .list { border-right: 1px solid var(--moss); padding: 8px 0; overflow: auto; display: flex; flex-direction: column; margin: 0; }
  #explorer .row { appearance: none; background: none; border: 0; text-align: left; padding: 6px 16px; font: inherit; color: var(--phosphor); cursor: pointer; display: grid; grid-template-columns: 10ch minmax(0, 1fr); gap: 12px; white-space: nowrap; }
  #explorer .row .perm { color: var(--phosphor-dim); }
  #explorer .row .name { overflow: hidden; text-overflow: ellipsis; }
  #explorer .row .ext { color: var(--phosphor-dim); }
  #explorer .row:hover { color: var(--phosphor-bloom); }
  #explorer .row[aria-selected="true"] { background: var(--moss); color: var(--phosphor-bloom); }
  #explorer .preview { padding: 20px 24px; overflow: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #explorer .preview h2 { margin: 0; font: 22px/1.15 VT323, ui-monospace, monospace; font-weight: 400; color: var(--phosphor); text-wrap: pretty; }
  #explorer .preview .meta { color: var(--phosphor-dim); font-size: 12px; }
  #explorer .preview p { margin: 0; color: var(--paper); max-width: 68ch; text-wrap: pretty; }
  #explorer .preview ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; color: var(--paper); max-width: 68ch; }
  #explorer .preview li { display: grid; grid-template-columns: 1ch minmax(0, 1fr); gap: 10px; text-wrap: pretty; }
  #explorer .preview li::before { content: "\00B7"; color: var(--phosphor-dim); }
  #explorer .ctl { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #explorer .tog { appearance: none; font: inherit; color: var(--phosphor); background: transparent; border: 1px solid var(--phosphor-dim); padding: 8px 12px; cursor: pointer; border-radius: 0; }
  #explorer .tog[aria-pressed="true"] { background: var(--phosphor); color: var(--ink); border-color: var(--phosphor); }
  #explorer .ctl label { display: flex; align-items: center; gap: 8px; color: var(--phosphor-dim); font-size: 12px; }
  #explorer .ctl input { width: 120px; margin: 0; accent-color: var(--phosphor); }
  /* studies card: the paper diagram. A full-bleed ink strip; base layers are always drawn, `.lit` copies, dots, cover and cursor
     animate on cue (12 s period: an accepted call, then a rejected one). Static under reduced motion. */
  #explorer .graph { margin: 0 -24px; padding: 8px; border: solid var(--moss); border-width: 1px 0; background: var(--ink); }
  #explorer .graph svg { display: block; width: 100%; height: auto; font-family: "IBM Plex Mono", ui-monospace, monospace; }
  #explorer .graph text { fill: var(--phosphor); text-anchor: middle; }
  #explorer .graph .t { font-size: 10px; font-weight: 500; }
  #explorer .graph .s { font-size: 9px; fill: var(--paper); }
  #explorer .graph .c { font-size: 8px; fill: var(--phosphor-dim); }
  #explorer .graph .live { fill: var(--phosphor); }
  #explorer .graph .l { text-anchor: start; }
  #explorer .graph .r { text-anchor: end; }
  #explorer .graph .bx { fill: var(--soil); stroke: var(--phosphor-dim); }
  #explorer .graph .nd { fill: var(--moss); stroke: var(--phosphor); }
  #explorer .graph .region { fill: none; stroke: var(--moss); stroke-dasharray: 4 3; }
  #explorer .graph .e { fill: none; stroke: var(--phosphor-dim); }
  #explorer .graph .qry { stroke-dasharray: 2 3; }
  #explorer .graph .hi { fill: none; stroke: var(--phosphor-bloom); }
  #explorer .graph .inv { fill: var(--phosphor); stroke: var(--phosphor-bloom); }
  #explorer .graph .lit { opacity: 0; filter: drop-shadow(0 0 3px var(--phosphor)); }
  #explorer .graph .lit text { fill: var(--phosphor-bloom); }
  #explorer .graph .lit text.ink { fill: var(--ink); }
  #explorer .graph .dot { fill: var(--phosphor-bloom); opacity: 0; }
  #explorer .graph .cover { fill: var(--soil); opacity: 0; transform-box: fill-box; transform-origin: 100% 50%; }
  #explorer .graph .cur { fill: var(--phosphor); opacity: 0; }
  #explorer .graph .anim .cover { opacity: 1; }
  #explorer .graph .anim .lit, #explorer .graph .anim .dot, #explorer .graph .anim .cover, #explorer .graph .anim .cur { animation: 12s linear infinite; }
  #explorer .ph { width: 100%; aspect-ratio: 16 / 9; max-height: 220px; border: 1px solid var(--moss); background-color: var(--soil); background-image: var(--dither); background-size: 16px 16px; image-rendering: pixelated; display: grid; place-items: center; }
  #explorer .ph span { font: 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--phosphor-dim); background: var(--soil); padding: 5px 8px; border: 1px solid var(--moss); }
  /* the stage: a dithered box looked at from a little above; on it a book (112×160×26), a game box (150×100×34) or a paint pot (an eight-sided body
     under a wider lid) turns once per 8 s, starting with its back to the viewer so the swap to the next item goes unseen */
  #explorer .stage { position: relative; width: 100%; height: 200px; flex: none; border: 1px solid var(--moss); background-color: var(--soil); background-image: var(--dither); background-size: 16px 16px; image-rendering: pixelated; display: grid; place-items: center; perspective: 700px; perspective-origin: 50% 30%; overflow: hidden; }
  #explorer .spin { position: relative; transform-style: preserve-3d; animation: book-spin 8s linear infinite; }
  #explorer .spin .face { position: absolute; top: 0; bottom: 0; border: 1px solid var(--phosphor-dim); background: var(--moss); backface-visibility: hidden; }
  #explorer .spin b { font: 11px/1.3 Silkscreen, VT323, ui-monospace, monospace; font-weight: 400; text-transform: uppercase; color: var(--phosphor); text-shadow: 0 0 8px var(--phosphor-dim); }
  #explorer .spin i { font: 14px/1 VT323, ui-monospace, monospace; font-style: normal; color: var(--paper); }
  #explorer .spin .front, #explorer .spin .back { left: 0; right: 0; background: var(--soil); }
  #explorer .spin .front { display: grid; align-content: end; gap: 8px; padding: 12px 10px; border-color: var(--phosphor); box-shadow: inset 0 0 0 4px var(--soil), inset 0 0 0 5px var(--moss); }
  #explorer .spin .back { background-image: var(--dither); background-size: 16px 16px; }
  #explorer .book { width: 112px; height: 160px; }
  #explorer .book .front { transform: translateZ(13px); }
  #explorer .book .back { transform: rotateY(180deg) translateZ(13px); }
  #explorer .book .spine { left: 0; width: 26px; transform: translateX(-13px) rotateY(-90deg); background: var(--soil); border-color: var(--phosphor); display: grid; place-items: center; }
  #explorer .book .spine b, #explorer .box .side b { writing-mode: vertical-rl; font-size: 9px; color: var(--phosphor-dim); text-shadow: none; white-space: nowrap; }
  #explorer .book .edge { right: 0; width: 26px; transform: translateX(13px) rotateY(90deg); background: repeating-linear-gradient(90deg, var(--paper) 0 1px, var(--soil) 1px 3px); border-color: var(--moss); }
  #explorer .box { width: 150px; height: 100px; }
  #explorer .box .front { transform: translateZ(17px); align-content: space-between; }
  #explorer .box .back { transform: rotateY(180deg) translateZ(17px); }
  #explorer .box .side { width: 34px; background: var(--soil); border-color: var(--phosphor); display: grid; place-items: center; }
  #explorer .box .side.l { left: 0; transform: translateX(-17px) rotateY(-90deg); }
  #explorer .box .side.r { right: 0; transform: translateX(17px) rotateY(90deg); }
  #explorer .box .cap { left: 0; right: 0; height: 34px; bottom: auto; background: var(--soil); }
  #explorer .box .cap.top { top: 0; transform: translateY(-17px) rotateX(90deg); }
  #explorer .box .cap.bottom { top: auto; bottom: 0; transform: translateY(17px) rotateX(-90deg); }
  /* the miniature: 90 px of figure on a 70 px base; every box face takes its colour from the painting step on data-i */
  #explorer .mini { width: 130px; height: 136px; margin-top: -70px; --mini-top: var(--paper); --mini-front: color-mix(in srgb, var(--paper) 70%, var(--soil)); --mini-side: color-mix(in srgb, var(--paper) 45%, var(--soil)); --mini-line: var(--soil); --mini-eye: transparent; --mini-trim: var(--mini-front); --mini-gun: var(--mini-side); }
  #explorer .mini[data-i="1"] { --mini-top: var(--soil); --mini-front: var(--ink); --mini-side: var(--ink); --mini-line: var(--moss); }
  #explorer .mini[data-i="2"] { --mini-top: var(--phosphor-dim); --mini-front: var(--moss); --mini-side: color-mix(in srgb, var(--moss) 70%, var(--ink)); --mini-line: var(--moss); --mini-eye: var(--phosphor-bloom); }
  #explorer .mini[data-i="3"] { --mini-top: var(--phosphor-dim); --mini-front: color-mix(in srgb, var(--moss) 85%, var(--ink)); --mini-side: color-mix(in srgb, var(--moss) 60%, var(--ink)); --mini-line: var(--ink); --mini-eye: var(--phosphor-bloom); }
  #explorer .mini[data-i="4"] { --mini-top: var(--phosphor-dim); --mini-front: var(--moss); --mini-side: color-mix(in srgb, var(--moss) 70%, var(--ink)); --mini-line: var(--phosphor); --mini-eye: var(--phosphor-bloom); --mini-trim: var(--phosphor-dim); --mini-gun: var(--soil); }
  #explorer .mini[data-i="2"], #explorer .mini[data-i="3"] { --mini-gun: var(--soil); }
  #explorer .mini .fig { position: absolute; left: 50%; bottom: 0; width: 0; height: 0; transform-style: preserve-3d; transform: scale(1.4); }
  #explorer .mini .bx { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  #explorer .mini .fc { position: absolute; left: 50%; top: 50%; box-sizing: border-box; border: 1px solid var(--mini-line); backface-visibility: hidden; transition: background-color 600ms, border-color 600ms; }
  #explorer .mini .fn, #explorer .mini .fb { background: var(--mini-front); }
  #explorer .mini .fl, #explorer .mini .fr { background: var(--mini-side); }
  #explorer .mini .ft { background: var(--mini-top); }
  #explorer .mini .fd { background: var(--ink); }
  #explorer .mini .trim .fc { background: var(--mini-trim); }
  #explorer .mini .gun .fc, #explorer .mini .rock .fc { background: var(--mini-gun); border-color: var(--ink); }
  #explorer .mini .rock .fc { background: color-mix(in srgb, var(--paper) 30%, var(--soil)); }
  #explorer .mini .fs { background: color-mix(in srgb, var(--mini-front) calc(var(--k) * 100%), var(--mini-side)); }
  #explorer .mini .pad .fs { background: color-mix(in srgb, var(--mini-top) calc(var(--k) * 100%), var(--mini-side)); }
  #explorer .mini .cap { border-radius: 50%; }
  #explorer .mini .half { border-radius: 50%; clip-path: inset(0 0 50% 0); background: var(--mini-side); border: 2px solid var(--mini-trim); }
  #explorer .mini .snout .fn { background: radial-gradient(circle at 30% 35%, var(--mini-eye) 1.2px, transparent 2px), radial-gradient(circle at 70% 35%, var(--mini-eye) 1.2px, transparent 2px), var(--mini-front); }
  #explorer .mini .rim { background: var(--soil); border-color: var(--phosphor-dim); }
  #explorer .mini .disc { border-radius: 50%; background: var(--soil); border: 2px solid var(--phosphor); }
  #explorer .cert { width: 130px; height: 170px; }
  #explorer .cert .front { transform: translateZ(4px); grid-template-rows: auto 1fr auto; align-content: start; justify-items: center; text-align: center; padding: 14px 12px; }
  #explorer .cert .front b { font-size: 9px; align-self: center; }
  #explorer .cert .ring { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--phosphor-dim); box-shadow: inset 0 0 0 3px var(--soil), inset 0 0 0 5px var(--phosphor-dim); }
  #explorer .cert .back { transform: rotateY(180deg) translateZ(4px); }
  #explorer .cert .side { width: 8px; background: var(--soil); border-color: var(--phosphor); }
  #explorer .cert .side.l { left: 0; transform: translateX(-4px) rotateY(-90deg); }
  #explorer .cert .side.r { right: 0; transform: translateX(4px) rotateY(90deg); }
  /* the stack rack: 24 px units between two rails; the stage grows to the list */
  #explorer .stage.rack { display: grid; place-items: stretch; align-content: start; height: auto; padding: 2px 18px; background-image: none; background: var(--ink); box-shadow: inset 14px 0 0 var(--moss), inset -14px 0 0 var(--moss); }
  #explorer .stage.rack .units { display: grid; gap: 2px; width: 100%; }
  #explorer .stage.rack .unit { height: 24px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 0 8px; background: var(--soil); border: 1px solid var(--moss); }
  #explorer .stage.rack .unit b { font: 9px/1 Silkscreen, VT323, ui-monospace, monospace; font-weight: 400; text-transform: uppercase; color: var(--phosphor); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #explorer .stage.rack .leds { display: flex; gap: 4px; }
  #explorer .stage.rack .leds i { width: 5px; height: 5px; background: var(--phosphor); box-shadow: 0 0 4px var(--phosphor-dim); animation: rack-led var(--p) steps(1) infinite var(--d); }
  #explorer .stage.rack .leds i.act { animation-name: rack-act; }
  @keyframes rack-led { 0%, 88% { background: var(--phosphor); } 88.1%, 100% { background: var(--moss); box-shadow: none; } }
  @keyframes rack-act { 0%, 45% { background: var(--phosphor); } 45.1%, 100% { background: var(--moss); box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { #explorer .stage.rack .leds i { animation: none; } }
  #explorer .caption { position: absolute; left: 0; right: 0; bottom: 12px; display: grid; justify-items: center; gap: 4px; }
  @keyframes book-spin { from { transform: rotateY(180deg); } to { transform: rotateY(540deg); } }
  @media (prefers-reduced-motion: reduce) { #explorer .spin { animation: none; transform: rotateY(-30deg); } }
  #explorer .status { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-top: 1px solid var(--moss); color: var(--phosphor-dim); font-size: 12px; white-space: nowrap; }
  #explorer :focus-visible { outline: 2px solid var(--phosphor-bloom); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { #dim, #explorer { transition: none; } }
  /* touch: no keyboard hints, 44px targets */
  #root[data-touch] #explorer .close .kbd { display: none; }
  #root[data-touch] #explorer .close { padding: 14px 16px; font-size: 13px; }
  #root[data-touch] #explorer .row { padding: 12px 16px; }
  #root[data-touch] #explorer .tog { padding: 12px 16px; }
  /* phones: a sheet up from the bottom edge; the file list becomes a tab strip along its top */
  @container (max-width: 767px) {
    #explorer { left: 0; top: var(--top-h, 96px); bottom: 0; width: 100%; height: auto; transform: translateY(var(--ex-slide)); border-width: 1px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    #explorer.on { transform: none; }
    #explorer .path { font-size: 20px; }
    #explorer .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    #explorer .list { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--moss); padding: 0 8px; overflow: auto hidden; scrollbar-width: none; }
    #explorer .list::-webkit-scrollbar { display: none; }
    #explorer .row { display: flex; align-items: center; gap: 0; padding: 12px 10px; min-height: 44px; border-bottom: 2px solid transparent; }
    #explorer .row .perm { display: none; }
    #explorer .row .name { overflow: visible; }
    #explorer .row[aria-selected="true"] { background: none; border-bottom-color: var(--phosphor-bloom); }
    #explorer .preview { padding: 16px; }
    #explorer .preview h2 { font-size: 20px; }
    #explorer .status { display: none; }
  }
  [hidden] { display: none !important; }
  /* site chrome: a bar along the top with the name and one link per object in the room. Flat soil, 1px moss rule. */
  #top { position: fixed; left: 0; right: 0; top: 0; min-height: 52px; display: flex; align-items: center; gap: 20px; padding: 0 16px; background: var(--soil); border-bottom: 1px solid var(--moss); font: 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--phosphor-dim); opacity: 0; transition: opacity 400ms linear; z-index: 1; }
  #top.on { opacity: 1; }
  #top .who { display: flex; flex-direction: column; gap: 3px; white-space: nowrap; flex: 0 0 auto; padding: 8px 0; }
  #top .who b { font: 26px/1 VT323, ui-monospace, monospace; color: var(--phosphor); font-weight: 400; }
  #top .who span { color: var(--phosphor); font-size: 12px; letter-spacing: 0.02em; }
  /* menu words: Silkscreen, a 5×5 bitmap face in the terminal/mainframe family; all caps, tracked out. One row: scrolls sideways before it wraps. */
  #top nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }

  #reset { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); appearance: none; font: 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); background: var(--phosphor); border: 1px solid var(--phosphor); padding: 10px 16px; cursor: pointer; border-radius: 0; white-space: nowrap; z-index: 2; }

  #reset:focus-visible { outline: 2px solid var(--phosphor-bloom); outline-offset: 2px; }

  #toast { position: fixed; left: 50%; top: calc(var(--top-h, 52px) + 12px); transform: translateX(-50%); font: 12px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--phosphor-bloom); background: var(--soil); border: 1px solid var(--phosphor); padding: 9px 14px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 200ms linear; z-index: 3; }

(function () {   // runs before the three.js modules download: a phone on a slow link sees the boot line, and a dead load names itself instead of staying black
  var q = new URLSearchParams(location.search), vp = /^(\d+)x(\d+)$/.exec(q.get('vp') || ''), root = document.getElementById('root');
  if (vp) { root.className = 'vp'; root.style.width = vp[1] + 'px'; root.style.height = vp[2] + 'px'; var s = Math.min(1, (innerWidth - 16) / vp[1], (innerHeight - 16) / vp[2]); if (s < 1) root.style.transform = 'translate(-50%, -50%) scale(' + s + ')'; }   // ?vp=390x844: phone-sized preview frame, scaled down to fit

  setTimeout(function () { if (!window.__theroom) document.getElementById('boot').textContent = 'the room did not load. it needs WebGL and a current browser.'; }, 15000);

// Screen textures. Two kinds: a log feed (gen = line generators; animate() pushes one every log.interval) and a shell
// (shell = SHELL: the transcript plus the line being typed, drawn under a prompt with a block cursor). scale multiplies the
// 256×160 base grid; a scaled texture gets mipmaps so it reads calmly from across the room and crisp up close.
class Terminal {
  constructor(gen, opts = {}) {
    const S = this.S = opts.scale || 1;
    [this.c, this.x] = cnv(256 * S, 160 * S); this.tex = canvasTex(this.c); this.gen = gen; this.cursor = true; this.stamp = opts.stamp !== false;
    this.shell = opts.shell || null; this.lines = this.shell ? this.shell.lines : [];
    if (S > 1) { this.tex.generateMipmaps = true; this.tex.minFilter = THREE.LinearMipmapLinearFilter; }
    if (this.gen) for (let i = 0; i < 10; i++) this.push();
    this.draw();
  }
  push() { if (!this.gen) return; const g = this.gen[Math.floor(Math.random() * this.gen.length)]; this.lines.push(this.stamp ? stamp() + ' ' + g() : g()); if (this.lines.length > 10) this.lines.shift(); }
  draw() {
    const x = this.x, F = this.shell ? (CONFIG.terminal.font || 1) : 1, S = this.S * F, lh = 14 * S, n = this.lines.length, T = CONFIG.terminal, sh = this.shell, pw = sh?.mode === 'password';   // F: larger shell glyphs on touch screens
    x.fillStyle = pal.ink; x.fillRect(0, 0, 256 * S, 160 * S);
    x.font = (14 * S) + 'px VT323, monospace'; x.textBaseline = 'top';
    this.lines.forEach((l, i) => { const dim = sh ? [T.prompt, T.rootPrompt, T.sudoPrompt].some(p => l.startsWith(p)) : i < n - 4; x.fillStyle = dim ? pal.phosphorDim : pal.phosphor; x.fillText(l, 5 * S, 4 * S + i * lh); });
    let cx = 5 * S; const cy = 4 * S + n * lh;
    if (sh) {   // the live line: dim prompt (ember for root), bright input (hidden while sudo asks for a password), then the cursor
      const P = pw ? T.sudoPrompt : sh.root ? T.rootPrompt : T.prompt;
      x.fillStyle = sh.root && !pw ? pal.ember : pal.phosphorDim; x.fillText(P, cx, cy); cx += x.measureText(P).width;
      if (!pw) { x.fillStyle = pal.phosphor; x.fillText(sh.input, cx, cy); cx += x.measureText(sh.input).width; }
    }
    if (this.cursor || (this.shell && performance.now() < this.shell.solidUntil)) { x.fillStyle = pal.phosphorBloom; x.fillRect(cx, cy, 7 * S, 12 * S); }
    this.tex.needsUpdate = true;
  }
}

// ───────────────────────────── geometry builder ─────────────────────────────
// Accumulates primitives for one object, paints vertex colours in world space,
// and merges them into one lit mesh + one emissive mesh (textured parts stay separate).
class Builder {
  constructor(def) {
    this.def = def; this.group = new THREE.Group(); this.group.name = def.id;
    this.group.position.fromArray(def.position); this.group.rotation.y = def.rotation || 0;
    this.group.updateMatrixWorld(true); this.world = this.group.matrixWorld.clone();
    this.lit = []; this.glow = [];
  }
  part(geo, o = {}) {
    if (o.scale) geo.scale(o.scale[0], o.scale[1], o.scale[2]);
    if (o.offset) geo.translate(o.offset[0], o.offset[1], o.offset[2]);
    const q = o.dir
      ? new THREE.Quaternion().setFromUnitVectors(UP, new THREE.Vector3().fromArray(o.dir).normalize())
      : new THREE.Quaternion().setFromEuler(new THREE.Euler((o.rot?.[0] || 0) * D2R, (o.rot?.[1] || 0) * D2R, (o.rot?.[2] || 0) * D2R));
    geo.applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3().fromArray(o.at || [0, 0, 0]), q, ONE));
    paint(geo, this.world, o.color || T.metal, !!o.emissive);
    if (o.material) { const m = new THREE.Mesh(geo, o.material); if (o.name) m.name = o.name; this.group.add(m); return m; }
    (o.emissive ? this.glow : this.lit).push(geo); return null;
  }
  box(w, h, d, o) { return this.part(new THREE.BoxGeometry(w, h, d), o); }
  cyl(rt, rb, h, seg, o) { return this.part(new THREE.CylinderGeometry(rt, rb, h, seg), o); }
  plane(w, h, o = {}) { return this.part(new THREE.PlaneGeometry(w, h, o.segs?.[0] || 1, o.segs?.[1] || 1), o); }
  sprite(at, scale, color, opacity, additive = true) { const s = makeSprite(color, opacity, additive); s.position.fromArray(at); s.scale.set(scale[0], scale[1], 1); this.group.add(s); return s; }
  // ink layer: an additive, unlit overlay (opacity 0) that the hover system fades in. Not raycast.
  inkMaterial(map) { return new THREE.MeshBasicMaterial({ map, color: CONFIG.palette.phosphor, transparent: true, opacity: 0, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }); }
  hover(fn) { this.group.userData.hover = fn; }
  finish() {
    if (this.lit.length) this.group.add(new THREE.Mesh(merge(this.lit), MAT.lit));
    if (this.glow.length) this.group.add(new THREE.Mesh(merge(this.glow), MAT.glow));
    return this.group;
  }
}

// ───────────────────────────── buildRoom ─────────────────────────────
// Floor, three walls, ceiling; merged into one mesh. Segmented so the AO gradient is smooth.
function buildRoom() {
  const { width: W, depth: D, height: H } = CONFIG.room;
  const b = new Builder({ id: 'room', position: [0, 0, 0] });
  b.plane(W, D, { rot: [-90, 0, 0], at: [0, 0, 0], color: T.floor, segs: [32, 24] });
  b.plane(W, D, { rot: [90, 0, 0], at: [0, H, 0], color: T.ceiling, segs: [32, 24] });
  b.plane(W, H, { at: [0, H / 2, -D / 2], color: T.wall, segs: [32, 12] });
  b.plane(D, H, { rot: [0, 90, 0], at: [-W / 2, H / 2, 0], color: T.wall, segs: [24, 12] });
  b.plane(D, H, { rot: [0, -90, 0], at: [W / 2, H / 2, 0], color: T.wall, segs: [24, 12] });
  return b.finish();
}

      { titles: L.academic, tones: ['pale', 'paleDim', 'pale'],            w: [0.05, 0.07],   h: [0.26, 0.29] },
      { titles: L.fiction,  tones: ['bookB', 'bookC', 'bookA', 'paleDim'], w: [0.028, 0.038], h: [0.175, 0.2] },

// ───────────────────────────── buildPost ─────────────────────────────
// One pass: linear→sRGB, optional phosphor ramp, 4×4 Bayer dither to N levels, scanlines, vignette.
const POST_SHADER = {
  uniforms: {
    tDiffuse: { value: null },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uLevels: { value: CONFIG.render.ditherLevels },
    uExposure: { value: CONFIG.render.exposure },
    uScanline: { value: CONFIG.render.scanline },
    uVignette: { value: CONFIG.render.vignette },
    uPhosphor: { value: CONFIG.render.phosphor ? 1 : 0 },
    uInk: { value: new THREE.Color(pal.ink) },
    uPhos: { value: new THREE.Color(pal.phosphor) },
    uBloom: { value: new THREE.Color(pal.phosphorBloom) }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform vec2 uResolution; uniform float uLevels, uScanline, uVignette, uPhosphor, uExposure;
    uniform vec3 uInk, uPhos, uBloom; varying vec2 vUv;
    vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c)); }
    float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    void main(){
      vec3 c = toSRGB(clamp(texture2D(tDiffuse, vUv).rgb * uExposure, 0.0, 1.0));
      // uInk/uPhos/uBloom arrive linear; convert so the ramp is built in display space
      vec3 ink = toSRGB(uInk), phos = toSRGB(uPhos), bloom = toSRGB(uBloom);
      if (uPhosphor > 0.5) {
        float l = clamp(dot(c, vec3(0.299, 0.587, 0.114)), 0.0, 1.0);
        c = l < 0.5 ? mix(ink, phos, l * 2.0) : mix(phos, bloom, (l - 0.5) * 2.0);
      }
      vec2 px = floor(gl_FragCoord.xy);
      float L = max(1.0, uLevels - 1.0);
      c = floor(c * L + bayer4(px)) / L;
      if (mod(px.y, 2.0) < 1.0) c *= 1.0 - uScanline;
      c *= 1.0 - uVignette * smoothstep(0.5, 1.45, length((vUv - 0.5) * 2.0));
      gl_FragColor = vec4(c, 1.0);
    }`
};
function buildPost(renderer, scene, camera) {
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const pass = new ShaderPass(POST_SHADER);
  composer.addPass(pass);
  return { composer, pass };
}

function updateLeds(t) {

  ANIM.leds.forEach((l, i) => {
    let on = ((t / l.period + l.phase) % 1) < l.duty;
    if (l.act && ((t / l.envelope + l.phase * 7) % 1) > l.burst) on = false;   // an activity light rests between bursts
    on = on || boost >= 1 || Math.random() < boost; if (on) lit++;

    for (let v = i * 24; v < (i + 1) * 24; v++) { arr[v * 3] = c.r; arr[v * 3 + 1] = c.g; arr[v * 3 + 2] = c.b; }
  });
  col.needsUpdate = true;
  ANIM.rackGlow.material.opacity = 0.12 + 0.25 * (lit / ANIM.leds.length) + 0.15 * boost;

}

// Paper diagram for the studies card. Top: the ontology (two tools joined by a `precedes` edge). Below: the LLM emits a call,
// the validator looks the tool up in the graph, walks its precondition, then accepts or rejects. The animation alternates the two
// outcomes (12 s period, 6 s each): base layers are always drawn, `.lit` copies and dots fade in on cue. Static under reduced motion.
function graphHtml() {
  const P = 12, pct = s => (s / P * 100).toFixed(3) + '%';
  const both = w => w.flatMap(([a, b]) => [[a, b], [a + 6, b + 6]]);
  const on = (n, w) => `@keyframes ${n}{0%{opacity:0}${w.map(([a, b]) => `${pct(a)}{opacity:0}${pct(a + .06)}{opacity:1}${pct(b)}{opacity:1}${pct(b + .12)}{opacity:0}`).join('')}100%{opacity:0}}`;
  const tr = ([x, y]) => `transform:translate(${x}px,${y}px)`;
  const move = (n, pts, t0, t1, offs) => {   // a dot rides the polyline `pts` from t0 to t1 in each cycle listed in offs
    const d = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1])), L = d.reduce((a, b) => a + b, 0), last = pts[pts.length - 1];
    let k = `0%{opacity:0;${tr(pts[0])}}`;
    for (const o of offs) {
      let acc = 0; k += `${pct(t0 + o)}{opacity:0;${tr(pts[0])}}${pct(t0 + o + .001)}{opacity:1;${tr(pts[0])}}`;
      pts.slice(1).forEach((p, i) => { acc += d[i]; k += `${pct(t0 + o + (t1 - t0) * acc / L)}{opacity:1;${tr(p)}}`; });
      k += `${pct(t1 + o + .001)}{opacity:0;${tr(last)}}`;
    }
    return `@keyframes ${n}{${k}100%{opacity:0;${tr(last)}}}`;
  };
  // the call is "typed": a cover the colour of the box shrinks away in character steps while a block cursor walks ahead of it
  const type = (n, t0, t1, tEnd) => `@keyframes ${n}{0%{transform:scaleX(1)}${[0, 6].map(o => `${pct(t0 + o)}{transform:scaleX(1);animation-timing-function:steps(27,end)}${pct(t1 + o)}{transform:scaleX(0);animation-timing-function:steps(1,end)}${pct(tEnd + o)}{transform:scaleX(1)}`).join('')}100%{transform:scaleX(1)}}`;
  const cursor = (n, t0, t1, tEnd) => `@keyframes ${n}{0%{opacity:0;transform:translateX(0)}${[0, 6].map(o => `${pct(t0 + o - .001)}{opacity:0;transform:translateX(0)}${pct(t0 + o)}{opacity:1;transform:translateX(0);animation-timing-function:steps(27,end)}${pct(t1 + o)}{opacity:1;transform:translateX(148px);animation-timing-function:steps(1,end)}${pct(t1 + o + .1)}{opacity:0;transform:translateX(148px)}${pct(tEnd + o)}{opacity:0;transform:translateX(0)}`).join('')}100%{opacity:0;transform:translateX(0)}}`;
  const kf = [
    on('kgCall', both([[.05, 1.5]])), type('kgType', .2, 1.2, 5.9), cursor('kgCur', .2, 1.2, 5.9),
    move('kgP1', [[170, 124], [170, 144]], 1.5, 1.9, [0, 6]),
    on('kgVal', both([[1.9, 4.6]])), on('kgQry', both([[2, 3.9]])),
    move('kgP2', [[250, 163], [316, 163], [316, 70]], 2, 2.6, [0, 6]),
    on('kgB', both([[2.6, 3.9]])), on('kgPre', both([[2.9, 3.9]])),
    move('kgP3', [[192, 41], [148, 41]], 2.9, 3.2, [0, 6]),
    on('kgAok', [[3.2, 3.9]]), on('kgAmiss', [[9.2, 9.32], [9.45, 9.57], [9.7, 9.9]]),
    move('kgP4a', [[170, 182], [170, 194], [86, 194], [86, 204]], 3.9, 4.5, [0]),
    move('kgP4b', [[170, 182], [170, 194], [254, 194], [254, 204]], 3.9, 4.5, [6]),
    on('kgAcc', [[4.5, 5.7]]), on('kgRej', [[10.5, 10.7], [10.85, 11.05], [11.2, 11.7]])
  ].join('');
  const txt = (c, x, y, s) => `<text class="${c}" x="${x}" y="${y}">${s}</text>`;
  const box = (rc, x, y, w, h, t, s, tc = '') => `<rect class="${rc}" x="${x}" y="${y}" width="${w}" height="${h}"/>${txt('t' + tc, x + w / 2, y + 16, t)}${txt('s' + tc, x + w / 2, y + 30, s)}`;
  const lit = (n, inner) => `<g class="lit" style="animation-name:${n}">${inner}</g>`;
  const dot = n => `<circle class="dot" r="2.5" style="animation-name:${n}"/>`;
  const A = ['find_customer', 'param: cpf (string)'], B = ['issue_contract', 'requires: customer found'], CALL = ['LLM generates tool call', 'issue_contract(customer=42)'],
    VAL = ['validator', 'queries the graph'], ACC = ['accept', 'find_customer ran before'], REJ = ['reject', 'precondition not met'];
  const ah = (id, fill) => `<marker id="${id}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--${fill})"/></marker>`;
  return `<div class="graph"><svg class="${MOTION ? 'anim' : ''}" viewBox="0 0 340 246" role="img" aria-label="The ontology declares that find_customer precedes issue_contract. The LLM generates the call issue_contract(customer=42); the validator queries the graph and accepts the call when find_customer ran before, or rejects it when that precondition is not met"><style>${kf}</style>
<defs>${ah('kg-ah', 'phosphor-dim')}${ah('kg-ahb', 'phosphor-bloom')}</defs>
<rect class="region" x="2" y="3" width="336" height="67"/>${txt('c l', 8, 14, 'ontology: semantic contract')}
${box('nd', 8, 22, 140, 38, ...A)}${txt('c r', 145, 31, '[ ]')}
${lit('kgAok', box('inv', 8, 22, 140, 38, ...A, ' ink') + txt('c r ink', 145, 31, '[x]'))}
${lit('kgAmiss', '<rect class="hi" x="8" y="22" width="140" height="38"/>' + txt('c r', 145, 31, '[ ]'))}
<line class="e" x1="148" y1="41" x2="192" y2="41" marker-end="url(#kg-ah)"/>${txt('c', 170, 36, 'precedes')}
${lit('kgPre', '<line class="hi" x1="148" y1="41" x2="192" y2="41" marker-end="url(#kg-ahb)"/>' + txt('c', 170, 36, 'precedes'))}
${box('nd', 192, 22, 140, 38, ...B)}${lit('kgB', box('hi', 192, 22, 140, 38, ...B))}
${box('bx', 90, 86, 160, 38, ...CALL, ' live')}${lit('kgCall', '<rect class="hi" x="90" y="86" width="160" height="38"/>' + txt('t', 170, 102, CALL[0]))}
<rect class="cover" x="96" y="108" width="148" height="11" style="animation-name:kgType"/><rect class="cur" x="96" y="109" width="5" height="9" style="animation-name:kgCur"/>
<line class="e" x1="170" y1="124" x2="170" y2="144" marker-end="url(#kg-ah)"/>
${box('bx', 90, 144, 160, 38, ...VAL)}${lit('kgVal', box('hi', 90, 144, 160, 38, ...VAL))}
<polyline class="e qry" points="250,163 316,163 316,70"/>${lit('kgQry', '<polyline class="hi qry" points="250,163 316,163 316,70"/>')}
<line class="e" x1="170" y1="182" x2="170" y2="194"/><line class="e" x1="86" y1="194" x2="254" y2="194"/><line class="e" x1="86" y1="194" x2="86" y2="204" marker-end="url(#kg-ah)"/><line class="e" x1="254" y1="194" x2="254" y2="204" marker-end="url(#kg-ah)"/>
${box('bx', 8, 204, 156, 38, ...ACC)}${lit('kgAcc', box('inv', 8, 204, 156, 38, ...ACC, ' ink'))}
${box('bx', 176, 204, 156, 38, ...REJ)}${lit('kgRej', box('hi', 176, 204, 156, 38, ...REJ))}
${dot('kgP1')}${dot('kgP2')}${dot('kgP3')}${dot('kgP4a')}${dot('kgP4b')}</svg></div>`;
}
function rainControlHtml() {
  return `<div class="ctl"><button type="button" class="tog" data-rain aria-pressed="${rain.on}">${rain.on ? 'rain: on' : 'rain: off'}</button><label>volume <input type="range" data-rain-vol min="0" max="1" step="0.05" value="${rain.vol}"></label></div>`;

rain.arm();
// canvas click: a press that didn't drag; raycast at the release point
let pressAt = null;
canvas.addEventListener('pointerdown', e => { pressAt = e.button === 0 && pointers.size <= 1 ? [e.clientX, e.clientY] : null; });   // a second finger is a pinch, never a tap
canvas.addEventListener('pointerup', e => {
  if (!pressAt || e.button !== 0 || debug.on || explorer.open) { pressAt = null; return; }
  const moved = Math.hypot(e.clientX - pressAt[0], e.clientY - pressAt[1]); pressAt = null;
  if (moved > CONFIG.explorer.dragTolerance) return;
  raycaster.setFromCamera(ndcOf(e), camera);
  let hit = null, best = Infinity;
  for (const tg of hover.targets) { const h = raycaster.intersectObjects(tg.meshes, false); if (h.length && h[0].distance < best) { best = h[0].distance; hit = tg; } }
  if (TERM.open) { if (!hit?.insp.terminal) leaveTerminal(); else { if (document.activeElement === shellIn) shellIn.blur(); shellIn.focus({ preventScroll: true }); } return; }   // a click off the screen glides back; on the screen, re-summons a dismissed keyboard
  if (hintFocus && !hit) { setHover(null); goZone(nav.zone, { push: false }); return; }   // off the dog or the note: back to the zone's shot
  if (e.pointerType === 'touch') {   // no hover on glass: the first tap lights the object and holds its label (the dog's chip is the clue); the next tap on it opens
    if (hit && hover.current !== hit) { setHover(hit); return; }
    setHover(hit); chipEl.querySelector('.more')?.remove();
  }

// dither swatch for image placeholders: 4×4 Bayer at ~30%, moss on soil, regenerated with the accent
function ditherSwatch() {
  const [c, x] = cnv(4, 4);
  for (let y = 0; y < 4; y++) for (let i = 0; i < 4; i++) { x.fillStyle = bayer4(i, y) < 0.2 ? CONFIG.palette.moss : CONFIG.palette.soil; x.fillRect(i, y, 1, 1); }
  return `url("${c.toDataURL()}")`;
}

// ───────────────────────────── debug ─────────────────────────────
const f2 = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);
const arr3 = v => `[${f2(v.x)}, ${f2(v.y)}, ${f2(v.z)}]`;
function hudJson() { return `{\n  "position": ${arr3(camera.position)},\n  "target":   ${arr3(controls ? controls.target : camState.target)}\n}`; }
let hudNote = '';
function updateHud() { hudEl.innerHTML = `${hudJson()}\n<span class="dim">d debug  c copy  p phosphor  f fps  a accent (${CONFIG.accent.name})${hudNote}</span>`; }
function setDebug(on) {
  debug.on = on; hudEl.hidden = !on; grid.visible = on;
  if (on) {
    if (!controls) { controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.dampingFactor = 0.12; }
    camera.position.copy(camState.position); controls.target.copy(camState.target); controls.enabled = true; controls.update();

}
async function copyHud() {
  try { await navigator.clipboard.writeText(hudJson()); hudNote = '  copied'; } catch { hudNote = '  copy failed'; }
  setTimeout(() => { hudNote = ''; }, 1200);
}
function setPhosphor(on) { CONFIG.render.phosphor = on; post.uniforms.uPhosphor.value = on ? 1 : 0; }

// ───────────────────────────── build / rebuild ─────────────────────────────
function build() {
  buildTextures();
  const room = buildRoom(); scene.add(room); BUILT.push(room);
  buildObjects(scene);
  if (!MOTION) { updateLeds(0); for (const term of [TEX.termL, TEX.termR]) { term.cursor = true; term.draw(); } }
  SPRITES.forEach(s => { s.visible = loaded && !(!MOTION && ANIM.steam.includes(s)); });
  buildHoverTargets();
}
function clearScene() {
  for (const g of BUILT) {
    scene.remove(g);
    g.traverse(o => {
      if (o.geometry && !o.isSprite) o.geometry.dispose();   // sprites share one static geometry
      if (o.material && ![MAT.lit, MAT.glow, MAT.led].includes(o.material)) { if (o.material.map && o.material.map !== TEX.glow) o.material.map.dispose(); o.material.dispose(); }
    });
  }
  BUILT.length = 0; SPRITES.length = 0; ANIM.screens.length = 0; ANIM.leds.length = 0; ANIM.steam.length = 0;
}
// Applies the current CONFIG.palette/tones to everything that isn't baked into geometry or textures.
function applyPaletteRuntime() {

function cycleAccent() {
  const names = Object.keys(CONFIG.accent.presets), i = names.indexOf(CONFIG.accent.name);
  setAccent(names[(i + 1) % names.length]);
}

addEventListener('keydown', e => {
  if (TERM.open) return;   // the shell has the keyboard (handled in capture, above)
  if (e.key === 'Escape' && explorer.open) { e.preventDefault(); closeExplorer(); return; }

accentEl.addEventListener('click', e => {
